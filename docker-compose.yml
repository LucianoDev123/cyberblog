services:

  cyberblog:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cyberblog
    restart: unless-stopped

    ports:
      - "80:80"

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      USERS_API_URL: ${USERS_API_URL}
      SECURITY_ANALYZER_WEBHOOK_URL: ${SECURITY_ANALYZER_WEBHOOK_URL}

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""

    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

    volumes:
      - ./public/uploads:/var/www/html/public/uploads

    networks:
      - cyberblog_network


  mysql:
    image: mysql:8.4
    container_name: cyberblog-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/cyberblog.sql:/docker-entrypoint-initdb.d/cyberblog.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cyberblog_network


  mailpit:
    image: axllent/mailpit:latest
    container_name: cyberblog-mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"

    networks:
      - cyberblog_network


networks:
  cyberblog_network:


volumes:
  mysql_data: